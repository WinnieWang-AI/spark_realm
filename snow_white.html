<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白雪公主 · SparkRealm StoryGraph</title>
<style>:root {
  color-scheme: light;
  --bg: #f5f6f5; --panel: #ffffff; --panel-2: #f0f2f1;
  --ink: #202823; --muted: #5b665f; --dim: #69756e; --border: #dce2de;
  --accent: #177b63; --accent-soft: #e7f2ed;
  --before: #687b91; --causes: #ba5063; --setsUp: #987017; --overlaps: #7564b5;
  --left-width: 240px; --right-width: 344px;
  --shadow: 0 6px 24px #18261d12;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101a2e; --panel: #17233b; --panel-2: #1d2c47;
  --ink: #e8eefb; --muted: #9fb0cc; --dim: #7385a3; --border: #2b3b5a;
  --accent: #4cc2f5; --accent-soft: #16324c;
  --before: #6ba4f7; --causes: #f2798a; --setsUp: #f2c14e; --overlaps: #a894f5;
  --shadow: 0 6px 24px #00000055;
}
* { box-sizing: border-box; letter-spacing: 0; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--bg); display: grid; grid-template: 60px 48px minmax(0, 1fr) / var(--left-width) minmax(0, 1fr) 0; grid-template-areas: "top top top" "bar bar bar" "left canvas right"; height: 100dvh; overflow: hidden; }
body.left-closed { --left-width: 0px; }
body.right-open { grid-template-columns: var(--left-width) minmax(0, 1fr) 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .38; }
button, select, input { border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
button:hover:not(:disabled) { background: var(--panel-2); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon-defs { width: 0; height: 0; position: absolute; }
.icon-button { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0; border-color: transparent; background: transparent; }
.divider { height: 20px; width: 1px; background: var(--border); flex: none; }
.topbar { grid-area: top; display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 25; min-width: 0; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand strong { font-size: 16px; white-space: nowrap; }
.brand-icon { color: var(--accent); width: 24px; height: 24px; }
.brand-logo { width: 26px; height: 26px; object-fit: contain; flex: none; }
.story-title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.header-actions { display: flex; align-items: center; gap: 12px; flex: none; }
.search-wrap { width: 244px; position: relative; display: flex; align-items: center; }
.search-wrap > .icon { position: absolute; left: 10px; color: var(--dim); pointer-events: none; }
#search { padding: 7px 10px 7px 34px; width: 100%; background: var(--panel-2); font-size: 13px; }
.search-results { position: absolute; right: 0; top: 42px; width: 360px; max-width: calc(100vw - 24px); max-height: 380px; overflow: auto; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
.search-result { display: block; text-align: left; width: 100%; border: 0; padding: 10px; }
.search-result.active { background: var(--accent-soft); }
.search-result .result-type { font-size: 11px; color: var(--dim); display: block; }
.search-result .result-text { display: block; overflow-wrap: anywhere; }
mark { color: var(--ink); background: var(--accent-soft); font-weight: 650; }
.search-empty { padding: 16px; color: var(--muted); }
.workspace-bar { grid-area: bar; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--panel); z-index: 10; }
.seg { display: flex; height: 100%; gap: 20px; }
.seg button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 0 4px; background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap; }
.seg button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 650; }
.subseg { margin-left: 8px; gap: 14px; }
.subseg button { font-size: 12px; }
.workspace-count { margin-left: auto; font-size: 12px; color: var(--dim); }
#toggle-right { margin-left: auto; }
.workspace-count + #toggle-right { margin-left: 0; }
.left { grid-area: left; min-width: 0; overflow: auto; border-right: 1px solid var(--border); background: var(--panel); z-index: 12; }
.left-closed .left { visibility: hidden; }
.panel { padding: 18px 14px; border-bottom: 1px solid var(--border); }
.section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.section-heading h2, .panel > summary { font-size: 12px; font-weight: 650; margin: 0; }
.section-heading > span { color: var(--dim); font-size: 12px; }
.panel > summary { cursor: pointer; }
.panel[open] > summary { margin-bottom: 14px; }
.act { margin-top: 10px; }
.act > summary { cursor: pointer; font-size: 12px; color: var(--dim); padding: 6px 0; overflow-wrap: anywhere; }
.scene-item, .entity-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; padding: 8px; font-size: 13px; }
.scene-item > span:last-child, .entity-item > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-number { color: var(--dim); font: 11px ui-monospace, monospace; width: 20px; flex: none; }
.scene-item.active, .entity-item.active { background: var(--accent-soft); color: var(--accent); }
.group-title { color: var(--dim); font-size: 11px; margin: 14px 0 6px; }
.entity-group { margin: 8px 0; }
.entity-group > summary { cursor: pointer; color: var(--dim); font-size: 11px; padding: 5px 0; }
.entity-group[open] > summary { margin-bottom: 4px; }
.entity-item .count { color: var(--dim); margin-left: auto; flex: none; font-size: 11px; }
.filter-label { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 0; }
input[type="checkbox"] { accent-color: var(--accent); }
.line-swatch { width: 20px; height: 0; border-top: 2px solid var(--before); }
.line-swatch.causes { border-color: var(--causes); }
.line-swatch.setsUp { border-color: var(--setsUp); border-top-style: dashed; }
.line-swatch.overlaps { border-color: var(--overlaps); border-top-style: dotted; }
.canvas { grid-area: canvas; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(circle at 1px 1px, var(--border) .7px, transparent 1px) 0 0 / 24px 24px, var(--bg); }
.story-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: none; cursor: grab; touch-action: none; }
.story-svg.active { display: block; }
.story-svg.panning { cursor: grabbing; }
.context-bar { position: absolute; left: 18px; right: 18px; top: 14px; z-index: 4; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
#mode-context { background: var(--bg); padding: 2px 5px; font-size: 11px; color: var(--dim); }
.layout-toggle { pointer-events: auto; font-size: 11px; padding: 3px 10px; border-radius: 6px; background: var(--panel); color: var(--muted); white-space: nowrap; }
.layout-toggle:hover { color: var(--ink); border-color: var(--dim); }
#relation-scope-wrap { font-size: 12px; color: var(--muted); pointer-events: auto; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; }
#relation-scope { max-width: 180px; width: 150px; font-size: 12px; padding: 4px; border: 0; }
.column-label { fill: var(--muted); font-size: 13px; font-weight: 600; }
.graph-node { cursor: pointer; outline: none; }
.node-box { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
.graph-node:hover .node-box { stroke: var(--dim); }
.graph-node.selected .node-box, .graph-node:focus-visible .node-box { stroke: var(--accent); stroke-width: 2.5; }
.graph-node.neighbor .node-box { stroke: var(--accent); stroke-opacity: .55; }
.graph-node.dim { opacity: .42; }
.node-content { width: 100%; height: 100%; padding: 15px; overflow: hidden; color: var(--ink); font-size: 13px; line-height: 1.5; }
.node-heading { display: flex; align-items: flex-start; gap: 9px; height: 43px; }
.node-number { flex: none; font: 11px/22px ui-monospace, monospace; color: var(--dim); }
.node-title { font-size: 14px; font-weight: 650; line-height: 21px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node-summary { margin: 6px 0 10px; height: 40px; color: var(--muted); font-size: 13px; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.node-people, .node-location { color: var(--muted); font-size: 11px; line-height: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node-location { color: var(--dim); }
.node-footer { display: flex; justify-content: space-between; gap: 6px; align-items: center; border-top: 1px solid var(--border); padding-top: 7px; margin-top: 8px; color: var(--dim); font-size: 10px; }
.node-badges { display: flex; gap: 8px; color: var(--accent); }
.role-climax .node-badges { color: var(--causes); }
.role-turningPoint .node-badges { color: var(--setsUp); }
.compact .node-content { padding: 10px 12px; }
.compact .node-heading { height: auto; }
.compact .node-title { font-size: 13px; line-height: 19px; }
.entity .node-content { padding: 10px 12px; }
.entity-heading { display: flex; align-items: center; gap: 8px; }
.entity-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.entity-kind { color: var(--accent); font-size: 10px; flex: none; }
.entity-kind.kind-location { color: var(--before); }
.entity-kind.kind-prop { color: var(--setsUp); }
.entity-count { color: var(--dim); font-size: 11px; margin-top: 7px; }
.sequence-edge { fill: none; stroke: var(--dim); stroke-width: 1.2; opacity: .45; }
.marker-sequence { fill: var(--dim); }
.logic-edge, .pair-edge { outline: none; cursor: pointer; }
.edge-line, .part-edge { fill: none; stroke-width: 1.7; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; }
.logic-edge { opacity: 0; pointer-events: none; }
.logic-edge .edge-hit { pointer-events: none; }
.logic-edge.visible, .logic-edge.hot, .logic-edge.hover-show { opacity: .8; pointer-events: auto; }
.logic-edge.visible .edge-hit, .logic-edge.hot .edge-hit, .logic-edge.hover-show .edge-hit { pointer-events: stroke; }
.edge-line { stroke: var(--before); }
.rel-causes .edge-line { stroke: var(--causes); }
.rel-setsUp .edge-line { stroke: var(--setsUp); stroke-dasharray: 5 4; }
.rel-overlaps .edge-line { stroke: var(--overlaps); stroke-dasharray: 2 4; }
.marker-before { fill: var(--before); }
.marker-causes { fill: var(--causes); }
.marker-setsUp { fill: var(--setsUp); }
.marker-person { fill: var(--accent); }
.pair-edge .edge-line { stroke: var(--accent); }
/* 要素关系：连线默认隐藏，选中/悬停或勾选“显示连线”才出现 */
.pair-edge, .part-edge { opacity: 0; pointer-events: none; }
.part-edge { stroke: var(--dim); }
.edge-line, .sequence-edge, .part-edge { vector-effect: non-scaling-stroke; }
.hot .edge-line, .logic-edge:focus-visible .edge-line, .pair-edge:focus-visible .edge-line { stroke-width: 3; }
.part-edge.hot, .part-edge.hover-show, .charm-svg.show-edges .part-edge { opacity: .5; stroke: var(--dim); }
.part-edge.hot { stroke: var(--accent); opacity: .8; stroke-width: 2; pointer-events: auto; }
.pair-edge.hot, .pair-edge.hover-show, .charm-svg.show-edges .pair-edge { opacity: .78; pointer-events: auto; }
.pair-edge.dim { opacity: .12; }
.scope-off, .type-off, .filter-off { display: none !important; }
.canvas-toolbar { position: absolute; left: 18px; bottom: 18px; display: flex; gap: 3px; align-items: center; padding: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 5; }
.zoom-value { width: 54px; border: 0; font-size: 12px; padding: 7px 0; background: transparent; font-variant-numeric: tabular-nums; }
.clear-selection { position: absolute; top: 52px; left: 22px; display: flex; align-items: center; gap: 5px; font-size: 11px; padding: 4px 7px; z-index: 5; }
.clear-selection .icon { width: 13px; height: 13px; }
.minimap { position: absolute; right: 18px; bottom: 18px; width: 144px; height: 96px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; box-shadow: var(--shadow); z-index: 5; cursor: crosshair; }
.minimap rect { fill: var(--dim); opacity: .4; }
.minimap rect.vp { fill: var(--accent); fill-opacity: .12; stroke: var(--accent); opacity: 1; }
.right { position: fixed; right: 0; top: 108px; bottom: 0; width: var(--right-width); min-width: 0; overflow: auto; background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow); visibility: hidden; z-index: 15; }
.right-open .right { visibility: visible; }
.detail-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 2; color: var(--dim); font-size: 12px; }
.detail-toolbar-left { display: flex; align-items: center; gap: 8px; }
.detail { padding: 20px; font-size: 13px; overflow-wrap: anywhere; }
.detail h3 { margin: 0 0 10px; font-size: 19px; line-height: 1.5; }
.detail h4, .detail details > summary { margin: 24px 0 10px; font-size: 12px; font-weight: 650; }
.detail details > summary { cursor: pointer; }
.detail p { color: var(--muted); line-height: 1.8; }
.detail .sub { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
.detail .row { margin: 7px 0; color: var(--muted); }
.detail .row b { color: var(--ink); font-weight: 550; }
.detail .ref-row { margin: 7px 0; }
.ref-kind { display: inline-block; min-width: 28px; color: var(--dim); font-size: 11px; margin-right: 6px; }
.ref-row .jump { color: var(--accent); }
.ref-row .jump:hover { text-decoration: underline; }
.ref-state { color: var(--muted); }
.detail .tag { display: inline-block; background: var(--panel-2); border-radius: 3px; padding: 2px 6px; font-size: 11px; margin: 0 4px 4px 0; }
.detail .jump { color: var(--accent); border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; }
.detail .jump:hover { text-decoration: underline; }
.edit-btn { font-size: 11px; padding: 2px 8px; margin-left: 6px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--accent); cursor: pointer; vertical-align: middle; }
.edit-btn:hover { border-color: var(--accent); }
.scene-nav { display: flex; justify-content: space-between; margin: 18px 0; }
.scene-nav button { display: flex; align-items: center; gap: 4px; padding: 6px 8px; font-size: 12px; }
.beat-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-left: 2px solid var(--border); border-radius: 0; padding: 8px 10px; margin: 4px 0; line-height: 1.8; font-size: 13px; overflow-wrap: anywhere; }
.beat-item b { display: block; color: var(--dim); font-size: 11px; }
.beat-item.selected { border-left-color: var(--accent); background: var(--accent-soft); }
.relation-item { border-top: 1px solid var(--border); padding: 10px 0; line-height: 1.8; }
.relation-item .scope-label { display: block; color: var(--dim); font-size: 11px; }
.pair-block { margin: 10px 0; }
.pair-block > summary { cursor: pointer; font-size: 13px; font-weight: 550; padding: 6px 0; }
.pair-block.static { font-size: 13px; font-weight: 550; }
.pair-chain { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 3px; }
.pair-block > summary .jump { border: 0; background: transparent; padding: 0; color: var(--accent); }
.detail .evo-event { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; padding: 9px 4px; line-height: 1.7; color: var(--ink); cursor: pointer; }
.detail .evo-event:hover { background: var(--panel-2); }
.rel-kinds { color: var(--ink); font-size: 12px; margin: 4px 0 6px; }
.evo-event b { display: block; }
.evo-transition { color: var(--accent); }
.evo-reason { display: block; color: var(--muted); font-size: 12px; }
.evo-preview { padding: 8px 4px 12px; border-top: 1px dashed var(--border); background: var(--panel-2); border-radius: 6px; }
.evo-preview .row { margin: 5px 0; }
.preview-beat { margin: 5px 0; color: var(--muted); line-height: 1.7; }
.preview-beat b { display: inline-block; min-width: 30px; color: var(--dim); font-weight: 500; margin-right: 6px; }
.detail .scene-appearance { padding: 10px 0; border-bottom: 1px solid var(--border); }
.detail .scene-appearance button { display: inline-flex; align-items: baseline; gap: 8px; }
.detail .scene-appearance p { margin: 6px 0; }
.detail code { font-size: 11px; }
.ref-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; margin-right: 8px; vertical-align: middle; }
#empty-state { position: absolute; inset: 40% 0 auto; text-align: center; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 1100px) {
  :root { --left-width: 210px; --right-width: 320px; }
  body.right-open { grid-template-columns: var(--left-width) minmax(0, 1fr) 0; }
  .minimap { display: none; }
}
@media (max-width: 700px) {
  body, body.right-open { grid-template-columns: 0 minmax(0, 1fr) 0; }
  .topbar { padding: 0 12px; gap: 12px; }
  .brand { gap: 7px; }
  .brand strong { font-size: 14px; }
  .brand .divider, .story-title { display: none; }
  .header-actions { gap: 3px; min-width: 0; }
  .search-wrap { width: 132px; }
  .workspace-bar { gap: 5px; padding: 0 8px; }
  .seg { gap: 14px; }
  .seg button { font-size: 12px; }
  .workspace-count { display: none; }
  #toggle-right { margin-left: auto; }
  .left { position: fixed; left: 0; top: 108px; bottom: 0; width: 260px; box-shadow: var(--shadow); }
  .right { width: min(344px, 100vw); }
  .context-bar { left: 12px; right: 12px; flex-wrap: wrap; }
  #relation-scope-wrap { margin-left: auto; }
  .canvas-toolbar { left: 12px; bottom: 12px; }
  .clear-selection { top: 84px; left: 12px; }
}
</style>

ene_006":3,"scene_007":0,"scene_008":1,"scene_009":2,"scene_010":0,"scene_012":1,"scene_013":2},"sceneTime":{"scene_001":"夜晚","scene_002":"早晨","scene_003":"下午","scene_004":"傍晚","scene_005":"夜晚","scene_006":"早晨","scene_007":"正午","scene_008":"下午","scene_009":"傍晚","scene_010":"夜晚","scene_012":"下午","scene_013":"傍晚","scene_014":"正午"},"timeKnown":["scene_002","scene_001","scene_005","scene_004","scene_008","scene_007","scene_009","scene_013","scene_012","scene_014","scene_006","scene_010"],"inverted":[],"actsFlat":[{"id":"act_1","title":"第一幕·嫉妒之始","summary":"白雪公主降生与继母的嫉妒，引出森林中的第一次生死抉择。","sceneIds":["scene_001","scene_002","scene_003","scene_004"]},{"id":"act_2","title":"第二幕·森林庇护与三次毒计","summary":"小矮人收留白雪公主，王后三次乔装加害，终以毒苹果得逞。","sceneIds":["scene_005","scene_014","scene_006","scene_007","scene_008","scene_009","scene_010"]},{"id":"act_3","title":"第三幕·苏醒与审判","summary":"王子唤醒白雪公主，恶王后在婚礼上受到惩罚。","sceneIds":["scene_012","scene_013"]}],"beats":[{"id":"beat_0001","kind":"narration","text":"冬夜，王后坐在乌木窗前缝衣，针尖刺破手指，三滴血落在雪上。","sceneId":"scene_001","index":0},{"id":"beat_0002","kind":"narration","text":"她许愿：愿女儿肌肤白如雪、唇红如血、发黑如乌木。","sceneId":"scene_001","index":1},{"id":"beat_0003","kind":"narration","text":"不久王后生下女儿便撒手人寰，国王为她取名白雪公主。","sceneId":"scene_001","index":2},{"id":"beat_0004","kind":"action","text":"国王抱着襁褓中的女儿，在空荡的寝宫里久久不语。","sceneId":"scene_001","index":3},{"id":"beat_0005","kind":"narration","text":"几年后国王续弦，新王后美貌而骄傲，还带来一面会说真话的魔镜。","sceneId":"scene_001","index":4},{"id":"beat_0006","kind":"narration","text":"新王后最得意的便是那面魔镜，它从不说谎。","sceneId":"scene_002","index":0},{"id":"beat_0007","kind":"dialogue","text":"魔镜魔镜，谁是这世上最美的女人？","speakerId":"char_queen","tone":"傲慢","sceneId":"scene_002","index":1},{"id":"beat_0008","kind":"narration","text":"镜面泛起涟漪，一个低沉的声音如实作答。","sceneId":"scene_002","index":2},{"id":"beat_0009","kind":"narration","text":"镜中声音道：\"王后，您很美，可白雪公主比您更美千倍。\"","sceneId":"scene_002","index":3},{"id":"beat_0010","kind":"action","text":"王后的笑意凝在脸上，指甲深深掐进掌心。","sceneId":"scene_002","index":4},{"id":"beat_0011","kind":"dialogue","text":"白雪……她竟敢比我美？","speakerId":"char_queen","tone":"咬牙切齿","sceneId":"scene_002","index":5},{"id":"beat_0012","kind":"dialogue","text":"把白雪公主带进森林，杀了她。带着她的肝和肺回来见我。","speakerId":"char_queen","tone":"阴狠","sceneId":"scene_003","index":0},{"id":"beat_0013","kind":"action","text":"猎人低头，握着剑柄的手微微发抖。","sceneId":"scene_003","index":1},{"id":"beat_0014","kind":"dialogue","text":"陛下……她只是个孩子。","speakerId":"char_hunter","tone":"迟疑","sceneId":"scene_003","index":2},{"id":"beat_0015","kind":"dialogue","text":"你敢违抗我的命令？","speakerId":"char_queen","tone":"不容置疑","sceneId":"scene_003","index":3},{"id":"beat_0016","kind":"narration","text":"猎人只得领命，转身去寻找白雪公主。","sceneId":"scene_003","index":4},{"id":"beat_0017","kind":"action","text":"猎人将白雪公主带到密林深处，缓缓拔出短刀。","sceneId":"scene_004","index":0},{"id":"beat_0018","kind":"dialogue","text":"好心的猎人，求您别杀我，我愿逃进森林，再也不回城堡。","speakerId":"char_snow","tone":"恐惧哀求","sceneId":"scene_004","index":1},{"id":"beat_0019","kind":"action","text":"猎人望着她泪湿的脸，终究心软了。","sceneId":"scene_004","index":2},{"id":"beat_0020","kind":"dialogue","text":"快走，越远越好，永远别回王宫。","speakerId":"char_hunter","tone":"压低而急促","sceneId":"scene_004","index":3},{"id":"beat_0021","kind":"narration","text":"猎人猎杀一头野猪，取出肝肺，作为白雪已死的凭证带回复命。","sceneId":"scene_004","index":4},{"id":"beat_0022","kind":"narration","text":"白雪公主在森林里跑了一整夜，天亮时发现一座小小的屋子。","sceneId":"scene_005","index":0},{"id":"beat_0023","kind":"action","text":"屋内七张小床整齐排列，她太累了，蜷在其中一张床上睡去。","sceneId":"scene_005","index":1},{"id":"beat_0024","kind":"narration","text":"傍晚，七个小矮人扛着镐头从矿山回来，点亮了油灯。","sceneId":"scene_005","index":2},{"id":"beat_0025","kind":"dialogue","text":"有人躺在我们床上！","speakerId":"char_doc","tone":"惊讶","sceneId":"scene_005","index":3},{"id":"beat_0026","kind":"dialogue","text":"谁准外人进屋的？快把她赶出去！","speakerId":"char_grumpy","tone":"不耐烦","sceneId":"scene_005","index":4},{"id":"beat_0027","kind":"action","text":"白雪公主醒来，向他们诉说自己的遭遇，小矮人们听得心都软了。","sceneId":"scene_005","index":5},{"id":"beat_0028","kind":"dialogue","text":"留下吧！你替我们看家做饭，我们保护你。","speakerId":"char_happy","tone":"欢快","sceneId":"scene_005","index":6},{"id":"beat_0029","kind":"narration","text":"小矮人们叮嘱：\"我们不在时，千万别给任何人开门。\"","sceneId":"scene_005","index":7},{"id":"beat_0030","kind":"dialogue","text":"魔镜魔镜，谁是这世上最美的女人？","speakerId":"char_queen","tone":"得意","sceneId":"scene_006","index":0},{"id":"beat_0031","kind":"narration","text":"镜中声音答：\"王后，越过七座山，白雪公主与小矮人同住，她比您更美千倍。\"","sceneId":"scene_006","index":1},{"id":"beat_0032","kind":"action","text":"王后摔碎手边的花瓶，眼中的杀意更盛。","sceneId":"scene_006","index":2},{"id":"beat_0033","kind":"dialogue","text":"既然猎人骗了我，那就由我亲自动手。","speakerId":"char_queen","tone":"阴毒","sceneId":"scene_006","index":3},{"id":"beat_0034","kind":"narration","text":"王后扮作卖杂货的老妇，挎着篮子来到小屋门前。","sceneId":"scene_007","index":0},{"id":"beat_0035","kind":"dialogue","text":"好姑娘，买条新丝带吧，衬你的腰身再合适不过。","speakerId":"char_queen","tone":"甜腻","sceneId":"scene_007","index":1},{"id":"beat_0036","kind":"dialogue","text":"谢谢您，我正缺一条丝带。","speakerId":"char_snow","tone":"天真","sceneId":"scene_007","index":2},{"id":"beat_0037","kind":"action","text":"老妇假意替她系上丝带，猛地一勒。","sceneId":"scene_007","index":3},{"id":"beat_0038","kind":"action","text":"白雪公主顿时喘不过气，倒地不动，老妇狞笑着离去。","sceneId":"scene_007","index":4},{"id":"beat_0039","kind":"narration","text":"夜里小矮人归来，剪断丝带，白雪公主才缓缓苏醒。","sceneId":"scene_007","index":5},{"id":"beat_0040","kind":"narration","text":"王后再次乔装，这回带来一把镶珠的毒梳。","sceneId":"scene_008","index":0},{"id":"beat_0041","kind":"dialogue","text":"让我替你梳梳头发吧，姑娘。","speakerId":"char_queen","tone":"诱哄","sceneId":"scene_008","index":1},{"id":"beat_0042","kind":"action","text":"梳齿刚触到头皮，白雪公主便昏倒在地。","sceneId":"scene_008","index":2},{"id":"beat_0043","kind":"dialogue","text":"这下你那雪白的脸，该安心睡去了。","speakerId":"char_queen","tone":"冷笑","sceneId":"scene_008","index":3},{"id":"beat_0044","kind":"narration","text":"小矮人归来，拔下毒梳，白雪公主又一次醒转。","sceneId":"scene_008","index":4},{"id":"beat_0045","kind":"dialogue","text":"再有人叫门，万万不能开！","speakerId":"char_doc","tone":"严厉","sceneId":"scene_008","index":5},{"id":"beat_0046","kind":"narration","text":"王后第三次而来，化作农妇，手捧一只红艳的苹果。","sceneId":"scene_009","index":0},{"id":"beat_0047","kind":"dialogue","text":"多水灵的姑娘，尝尝这苹果吧，甜得很。","speakerId":"char_queen","tone":"亲热","sceneId":"scene_009","index":1},{"id":"beat_0048","kind":"dialogue","text":"小矮人嘱咐过，不能收陌生人的东西。","speakerId":"char_snow","tone":"犹豫","sceneId":"scene_009","index":2},{"id":"beat_0049","kind":"action","text":"老妇咬下白净的一半自证无毒，把另一半递了过去。","sceneId":"scene_009","index":3},{"id":"beat_0050","kind":"action","text":"白雪公主咬下红的一半，当即倒地气绝。","sceneId":"scene_009","index":4},{"id":"beat_0051","kind":"narration","text":"那半只苹果，恰恰浸满了剧毒。","sceneId":"scene_009","index":5},{"id":"beat_0052","kind":"action","text":"小矮人们围在白雪公主身旁，怎么呼唤都唤不醒。","sceneId":"scene_010","index":0},{"id":"beat_0053","kind":"dialogue","text":"她……没有呼吸了。","speakerId":"char_grumpy","tone":"哽咽","sceneId":"scene_010","index":1},{"id":"beat_0054","kind":"narration","text":"他们不忍将她埋进泥土，便做了一口透明的水晶棺，让她静静躺在里面。","sceneId":"scene_010","index":2},{"id":"beat_0055","kind":"action","text":"小矮人们轮流守在棺旁，日复一日。","sceneId":"scene_010","index":3},{"id":"beat_0056","kind":"narration","text":"白雪公主的面容依旧红润如生，仿佛只是睡着了。","sceneId":"scene_010","index":4},{"id":"beat_0061","kind":"action","text":"小矮人们抬着水晶棺，正要把她安葬到山中，途中一名小矮人绊倒，棺身猛地一震。","sceneId":"scene_012","index":0},{"id":"beat_0062","kind":"narration","text":"卡在白雪公主喉间的毒苹果被震了出来，她轻轻咳了一声。","sceneId":"scene_012","index":1},{"id":"beat_0063","kind":"action","text":"白雪公主缓缓睁开眼，坐起身来。","sceneId":"scene_012","index":2},{"id":"beat_0064","kind":"dialogue","text":"我……这是在哪儿？","speakerId":"char_snow","tone":"茫然","sceneId":"scene_012","index":3},{"id":"beat_0065","kind":"dialogue","text":"你醒了！可把我们吓坏了！","speakerId":"char_doc","tone":"惊喜","sceneId":"scene_012","index":4},{"id":"beat_0066","kind":"narration","text":"小矮人们又惊又喜，簇拥着白雪公主返回城堡。","sceneId":"scene_012","index":5},{"id":"beat_0067","kind":"narration","text":"白雪公主回到城堡，恶王后三番加害的罪行很快传遍全城。","sceneId":"scene_013","index":0},{"id":"beat_0068","kind":"action","text":"侍从认出那位艳丽的妇人，正是作恶多端的新王后，将她押到殿前。","sceneId":"scene_013","index":1},{"id":"beat_0069","kind":"dialogue","text":"你们……要做什么？","speakerId":"char_queen","tone":"惊惶不解","sceneId":"scene_013","index":2},{"id":"beat_0070","kind":"action","text":"侍从取出一双烧得通红的铁鞋，摆在她面前。","sceneId":"scene_013","index":3},{"id":"beat_0071","kind":"narration","text":"王后被迫穿上铁鞋，在众人注视下不停跳舞，直到倒下。","sceneId":"scene_013","index":4},{"id":"beat_0072","kind":"narration","text":"从此，白雪公主重归城堡，与七个小矮人一起过上了安稳幸福的生活。","sceneId":"scene_013","index":5},{"id":"beat_0073","kind":"narration","text":"白日里，小矮人们扛着镐头下到矿山，叮叮当当地敲打岩壁。","sceneId":"scene_014","index":0},{"id":"beat_0074","kind":"dialogue","text":"都仔细些，敲下宝石好换些盐和布。","speakerId":"char_doc","tone":"叮嘱","sceneId":"scene_014","index":1},{"id":"beat_0075","kind":"dialogue","text":"阿嚏——这矿灰，呛得人直打喷嚏！","speakerId":"char_sneezy","tone":"鼻音浓重","sceneId":"scene_014","index":2},{"id":"beat_0076","kind":"dialogue","text":"等回去就能喝上白雪做的热汤啦！","speakerId":"char_happy","tone":"欢喜","sceneId":"scene_014","index":3},{"id":"beat_0077","kind":"dialogue","text":"哼，我可不是想她做的饭……只是别把屋子给烧了。","speakerId":"char_grumpy","tone":"嘴硬","sceneId":"scene_014","index":4},{"id":"beat_0078","kind":"action","text":"糊涂蛋憨憨地跟着挥镐，一下砸偏了石头。","sceneId":"scene_014","index":5},{"id":"beat_0079","kind":"narration","text":"他们心里都惦记着独自看家的小姑娘，不知不觉加快了手上的活。","sceneId":"scene_014","index":6}],"beatsOf":{"scene_001":[{"id":"beat_0001","kind":"narration","text":"冬夜，王后坐在乌木窗前缝衣，针尖刺破手指，三滴血落在雪上。"},{"id":"beat_0002","kind":"narration","text":"她许愿：愿女儿肌肤白如雪、唇红如血、发黑如乌木。"},{"id":"beat_0003","kind":"narration","text":"不久王后生下女儿便撒手人寰，国王为她取名白雪公主。"},{"id":"beat_0004","kind":"action","text":"国王抱着襁褓中的女儿，在空荡的寝宫里久久不语。"},{"id":"beat_0005","kind":"narration","text":"几年后国王续弦，新王后美貌而骄傲，还带来一面会说真话的魔镜。"}],"scene_002":[{"id":"beat_0006","kind":"narration","text":"新王后最得意的便是那面魔镜，它从不说谎。"},{"id":"beat_0007","kind":"dialogue","speakerId":"char_queen","tone":"傲慢","text":"魔镜魔镜，谁是这世上最美的女人？"},{"id":"beat_0008","kind":"narration","text":"镜面泛起涟漪，一个低沉的声音如实作答。"},{"id":"beat_0009","kind":"narration","text":"镜中声音道：\"王后，您很美，可白雪公主比您更美千倍。\""},{"id":"beat_0010","kind":"action","text":"王后的笑意凝在脸上，指甲深深掐进掌心。"},{"id":"beat_0011","kind":"dialogue","speakerId":"char_queen","tone":"咬牙切齿","text":"白雪……她竟敢比我美？"}],"scene_003":[{"id":"beat_0012","kind":"dialogue","speakerId":"char_queen","tone":"阴狠","text":"把白雪公主带进森林，杀了她。带着她的肝和肺回来见我。"},{"id":"beat_0013","kind":"action","text":"猎人低头，握着剑柄的手微微发抖。"},{"id":"beat_0014","kind":"dialogue","speakerId":"char_hunter","tone":"迟疑","text":"陛下……她只是个孩子。"},{"id":"beat_0015","kind":"dialogue","speakerId":"char_queen","tone":"不容置疑","text":"你敢违抗我的命令？"},{"id":"beat_0016","kind":"narration","text":"猎人只得领命，转身去寻找白雪公主。"}],"scene_004":[{"id":"beat_0017","kind":"action","text":"猎人将白雪公主带到密林深处，缓缓拔出短刀。"},{"id":"beat_0018","kind":"dialogue","speakerId":"char_snow","tone":"恐惧哀求","text":"好心的猎人，求您别杀我，我愿逃进森林，再也不回城堡。"},{"id":"beat_0019","kind":"action","text":"猎人望着她泪湿的脸，终究心软了。"},{"id":"beat_0020","kind":"dialogue","speakerId":"char_hunter","tone":"压低而急促","text":"快走，越远越好，永远别回王宫。"},{"id":"beat_0021","kind":"narration","text":"猎人猎杀一头野猪，取出肝肺，作为白雪已死的凭证带回复命。"}],"scene_005":[{"id":"beat_0022","kind":"narration","text":"白雪公主在森林里跑了一整夜，天亮时发现一座小小的屋子。"},{"id":"beat_0023","kind":"action","text":"屋内七张小床整齐排列，她太累了，蜷在其中一张床上睡去。"},{"id":"beat_0024","kind":"narration","text":"傍晚，七个小矮人扛着镐头从矿山回来，点亮了油灯。"},{"id":"beat_0025","kind":"dialogue","speakerId":"char_doc","tone":"惊讶","text":"有人躺在我们床上！"},{"id":"beat_0026","kind":"dialogue","speakerId":"char_grumpy","tone":"不耐烦","text":"谁准外人进屋的？快把她赶出去！"},{"id":"beat_0027","kind":"action","text":"白雪公主醒来，向他们诉说自己的遭遇，小矮人们听得心都软了。"},{"id":"beat_0028","kind":"dialogue","speakerId":"char_happy","tone":"欢快","text":"留下吧！你替我们看家做饭，我们保护你。"},{"id":"beat_0029","kind":"narration","text":"小矮人们叮嘱：\"我们不在时，千万别给任何人开门。\""}],"scene_006":[{"id":"beat_0030","kind":"dialogue","speakerId":"char_queen","tone":"得意","text":"魔镜魔镜，谁是这世上最美的女人？"},{"id":"beat_0031","kind":"narration","text":"镜中声音答：\"王后，越过七座山，白雪公主与小矮人同住，她比您更美千倍。\""},{"id":"beat_0032","kind":"action","text":"王后摔碎手边的花瓶，眼中的杀意更盛。"},{"id":"beat_0033","kind":"dialogue","speakerId":"char_queen","tone":"阴毒","text":"既然猎人骗了我，那就由我亲自动手。"}],"scene_007":[{"id":"beat_0034","kind":"narration","text":"王后扮作卖杂货的老妇，挎着篮子来到小屋门前。"},{"id":"beat_0035","kind":"dialogue","speakerId":"char_queen","tone":"甜腻","text":"好姑娘，买条新丝带吧，衬你的腰身再合适不过。"},{"id":"beat_0036","kind":"dialogue","speakerId":"char_snow","tone":"天真","text":"谢谢您，我正缺一条丝带。"},{"id":"beat_0037","kind":"action","text":"老妇假意替她系上丝带，猛地一勒。"},{"id":"beat_0038","kind":"action","text":"白雪公主顿时喘不过气，倒地不动，老妇狞笑着离去。"},{"id":"beat_0039","kind":"narration","text":"夜里小矮人归来，剪断丝带，白雪公主才缓缓苏醒。"}],"scene_008":[{"id":"beat_0040","kind":"narration","text":"王后再次乔装，这回带来一把镶珠的毒梳。"},{"id":"beat_0041","kind":"dialogue","speakerId":"char_queen","tone":"诱哄","text":"让我替你梳梳头发吧，姑娘。"},{"id":"beat_0042","kind":"action","text":"梳齿刚触到头皮，白雪公主便昏倒在地。"},{"id":"beat_0043","kind":"dialogue","speakerId":"char_queen","tone":"冷笑","text":"这下你那雪白的脸，该安心睡去了。"},{"id":"beat_0044","kind":"narration","text":"小矮人归来，拔下毒梳，白雪公主又一次醒转。"},{"id":"beat_0045","kind":"dialogue","speakerId":"char_doc","tone":"严厉","text":"再有人叫门，万万不能开！"}],"scene_009":[{"id":"beat_0046","kind":"narration","text":"王后第三次而来，化作农妇，手捧一只红艳的苹果。"},{"id":"beat_0047","kind":"dialogue","speakerId":"char_queen","tone":"亲热","text":"多水灵的姑娘，尝尝这苹果吧，甜得很。"},{"id":"beat_0048","kind":"dialogue","speakerId":"char_snow","tone":"犹豫","text":"小矮人嘱咐过，不能收陌生人的东西。"},{"id":"beat_0049","kind":"action","text":"老妇咬下白净的一半自证无毒，把另一半递了过去。"},{"id":"beat_0050","kind":"action","text":"白雪公主咬下红的一半，当即倒地气绝。"},{"id":"beat_0051","kind":"narration","text":"那半只苹果，恰恰浸满了剧毒。"}],"scene_010":[{"id":"beat_0052","kind":"action","text":"小矮人们围在白雪公主身旁，怎么呼唤都唤不醒。"},{"id":"beat_0053","kind":"dialogue","speakerId":"char_grumpy","tone":"哽咽","text":"她……没有呼吸了。"},{"id":"beat_0054","kind":"narration","text":"他们不忍将她埋进泥土，便做了一口透明的水晶棺，让她静静躺在里面。"},{"id":"beat_0055","kind":"action","text":"小矮人们轮流守在棺旁，日复一日。"},{"id":"beat_0056","kind":"narration","text":"白雪公主的面容依旧红润如生，仿佛只是睡着了。"}],"scene_012":[{"id":"beat_0061","kind":"action","text":"小矮人们抬着水晶棺，正要把她安葬到山中，途中一名小矮人绊倒，棺身猛地一震。"},{"id":"beat_0062","kind":"narration","text":"卡在白雪公主喉间的毒苹果被震了出来，她轻轻咳了一声。"},{"id":"beat_0063","kind":"action","text":"白雪公主缓缓睁开眼，坐起身来。"},{"id":"beat_0064","kind":"dialogue","speakerId":"char_snow","tone":"茫然","text":"我……这是在哪儿？"},{"id":"beat_0065","kind":"dialogue","speakerId":"char_doc","tone":"惊喜","text":"你醒了！可把我们吓坏了！"},{"id":"beat_0066","kind":"narration","text":"小矮人们又惊又喜，簇拥着白雪公主返回城堡。"}],"scene_013":[{"id":"beat_0067","kind":"narration","text":"白雪公主回到城堡，恶王后三番加害的罪行很快传遍全城。"},{"id":"beat_0068","kind":"action","text":"侍从认出那位艳丽的妇人，正是作恶多端的新王后，将她押到殿前。"},{"id":"beat_0069","kind":"dialogue","speakerId":"char_queen","tone":"惊惶不解","text":"你们……要做什么？"},{"id":"beat_0070","kind":"action","text":"侍从取出一双烧得通红的铁鞋，摆在她面前。"},{"id":"beat_0071","kind":"narration","text":"王后被迫穿上铁鞋，在众人注视下不停跳舞，直到倒下。"},{"id":"beat_0072","kind":"narration","text":"从此，白雪公主重归城堡，与七个小矮人一起过上了安稳幸福的生活。"}],"scene_014":[{"id":"beat_0073","kind":"narration","text":"白日里，小矮人们扛着镐头下到矿山，叮叮当当地敲打岩壁。"},{"id":"beat_0074","kind":"dialogue","speakerId":"char_doc","tone":"叮嘱","text":"都仔细些，敲下宝石好换些盐和布。"},{"id":"beat_0075","kind":"dialogue","speakerId":"char_sneezy","tone":"鼻音浓重","text":"阿嚏——这矿灰，呛得人直打喷嚏！"},{"id":"beat_0076","kind":"dialogue","speakerId":"char_happy","tone":"欢喜","text":"等回去就能喝上白雪做的热汤啦！"},{"id":"beat_0077","kind":"dialogue","speakerId":"char_grumpy","tone":"嘴硬","text":"哼，我可不是想她做的饭……只是别把屋子给烧了。"},{"id":"beat_0078","kind":"action","text":"糊涂蛋憨憨地跟着挥镐，一下砸偏了石头。"},{"id":"beat_0079","kind":"narration","text":"他们心里都惦记着独自看家的小姑娘，不知不觉加快了手上的活。"}]},"beatOwner":{"beat_0001":"scene_001","beat_0002":"scene_001","beat_0003":"scene_001","beat_0004":"scene_001","beat_0005":"scene_001","beat_0006":"scene_002","beat_0007":"scene_002","beat_0008":"scene_002","beat_0009":"scene_002","beat_0010":"scene_002","beat_0011":"scene_002","beat_0012":"scene_003","beat_0013":"scene_003","beat_0014":"scene_003","beat_ <script>(function () {

  }

  function status(message) { document.getElementById('status').textContent = message; }

  // ---- 编辑：提交 ChangeSet 并保留视角 ----
  function saveSession() {
    try {
      const views = {};
      for (const svg of svgs) { const v = view.get(svg); views[svg.dataset.mode] = { x: v.x, y: v.y, w: v.w, h: v.h }; }
      sessionStorage.setItem('sparkrealm-view', JSON.stringify({ mode: state.mode, selected: state.selected, relationScene: state.relationScene, views }));
    } catch (_) { /* ignore */ }
  }
  function restoreSession() {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('sparkrealm-view') || 'null'); } catch (_) { saved = null; }
    if (!saved) return;
    try { sessionStorage.removeItem('sparkrealm-view'); } catch (_) { /* ignore */ }
    if (saved.relationScene) state.relationScene = saved.relationScene;
    if (saved.mode) setMode(saved.mode);
    for (const svg of svgs) { const s = saved.views && saved.views[svg.dataset.mode]; if (s) Object.assign(view.get(svg), { x: s.x, y: s.y, w: s.w, h: s.h }); }
    if (saved.selected) select(saved.selected.type, saved.selected.id);
    applyView(activeSvg());
  }
  async function sendChange(operations) {
    if (!window.__SERVED__) return;
    saveSession();
    const changeSet = { changeId: `ui_${Date.now()}`, storyId: data.storyId, baseRevision: data.revision, actor: { kind: 'user', id: 'local' }, operations };
    try {
      const response = await fetch('/apply', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ changeSet }) });

  function updateBack() { const button = document.getElementById('detail-back'); if (button) button.disabled = state.history.length === 0; }

    if (!prev) return;
    state.restoring = true;
    if (prev.mode && prev.mode !== state.mode) setMode(prev.mode);
    state.restoring = false;
    if (prev.selected) select(prev.selected.type, prev.selected.id, true);
    else clearSelection();
  }
  function navigateTo(mode, type, id, focus = false) {
    const same = state.selected && state.selected.type === type && state.selected.id === id && (!mode || mode === state.mode);
    if (!same && !state.restoring) pushHistory();
    if (mode && mode !== state.mode) setMode(mode);
    select(type, id, focus);
  }
  function canvasSize() {
    const rect = document.getElementById('canvas').getBoundingClientRect();
    const width = Math.max(320, rect.width), height = Math.max(240, rect.height);
    return { width, height, ratio: width / height };
  }
  function applyView(svg) {
    const current = view.get(svg);
    svg.setAttribute('viewBox', `${current.x} ${current.y} ${current.w} ${current.h}`);
    if (svg === activeSvg()) {
      document.getElementById('zoom-reset').textContent = `${Math.round((canvasSize().width / current.w) * 100)}%`;
      renderMinimap();
    }
  }
  function readableView() {
    const svg = activeSvg(), current = view.get(svg), canvas = canvasSize();
    const width = Math.max(canvas.width, Math.min(current.full.w, canvas.width / 0.88)); // 图比画布窄时按 100% 显示
    current.w = width; current.h = width / canvas.ratio;
    current.x = current.full.x;
    current.y = current.full.y;
    applyView(svg);
  }
  function fitAll() {
    const svg = activeSvg(), current = view.get(svg), canvas = canvasSize();
    const graphRatio = current.full.w / current.full.h;
    if (graphRatio > canvas.ratio) {
      current.w = current.full.w; current.h = current.w / canvas.ratio;
      current.x = current.full.x; current.y = current.full.y - (current.h - current.full.h) / 2;
    } else {
      current.h = current.full.h; current.w = current.h * canvas.ratio;
      current.y = current.full.y; current.x = current.full.x - (current.w - current.full.w) / 2;
    }
    applyView(svg);
  }
  function zoom(factor, center) {
    const svg = activeSvg(), current = view.get(svg);
    const nextWidth = Math.min(Math.max(current.full.w * 2.4, 280), Math.max(280, current.w * factor));
    const actual = nextWidth / current.w;
    const point = center || { x: current.x + current.w / 2, y: current.y + current.h / 2 };
    current.x = point.x - (point.x - current.x) * actual;
    current.y = point.y - (point.y - current.y) * actual;
    current.w = nextWidth; current.h *= actual; applyView(svg);
  }
  function focusNode(id, force = false) {
    const rect = data.geoms[state.mode]?.rects?.[id];
    if (!rect) return;
    const svg = activeSvg(), current = view.get(svg), canvas = canvasSize();
    const pad = 40;
    const inside = rect.x >= current.x + pad && rect.y >= current.y + pad
      && rect.x + rect.w <= current.x + current.w - pad && rect.y + rect.h <= current.y + current.h - pad;
    if (inside && !force) return; // 已在视野内则不调整
    if (force) { // 仅主动“定位”时才改变缩放：放大到可读比例
      current.w = Math.min(current.full.w, Math.max(520, canvas.width / 0.92));
      current.h = current.w / canvas.ratio;
    }
    // 其余情况保持当前缩放，只平移到可见
    current.x = rect.x + rect.w / 2 - current.w / 2;
    current.y = rect.y + rect.h / 2 - current.h / 2;
    applyView(svg);
  }

  function renderOutline() {

  function renderEntities() {
    document.getElementById('entities').innerHTML = Object.entries(TYPES).map(([kind, label]) => {
      const list = data.entitiesByKind[kind] || [];

  function renderFilters() {

  function renderRelationScope() {

  function applyFilters() {
    for (const svg of svgs) {

        edge.classList.toggle('filter-off', !visible); edge.classList.toggle('visible', visible);
      });
      svg.querySelectorAll('.entity').forEach((node) => node.classList.toggle('type-off', !state.entityKinds.has(node.dataset.kind)));

        const relation = data.characterRelations.find((item) => item.id === edge.dataset.relationId);
        edge.classList.toggle('scope-off', state.relationScene !== 'all' && !relation?.sceneIds.includes(state.relationScene));
      });
    }
    renderMinimap();
  }

  function clearMarks() {
    svgs.forEach((svg) => svg.querySelectorAll('.selected,.neighbor,.hot,.dim,.hover-show').forEach((node) => node.classList.remove('selected', 'neighbor', 'hot', 'dim', 'hover-show')));

  function openDetail() {

  function clearSelection() {

  function select(type, id, shouldFocus = false) {
    state.selected = { type, id }; clearMarks();

    if (type === 'scene') {

  }

  function changeOf(pair, sid) {
    const scenes = data.order;
    const factsById = new Map(pair.facts.map((fact) => [fact.id, fact]));
    const activeAt = (s) => (pair.perScene[s] || []).map((fid) => factsById.get(fid)).filter(Boolean);
    const idx = scenes.indexOf(sid);
    const prevSid = idx > 0 ? scenes[idx - 1] : null;
    const current = [...new Set(activeAt(sid).map((fact) => fact.kind))];
    const previous = prevSid ? [...new Set(activeAt(prevSid).map((fact) => fact.kind))] : [];
    const reasons = [...new Set(activeAt(sid).filter((fact) => !previous.includes(fact.kind)).map((fact) => fact.description).filter(Boolean))];
    const reason = reasons.length ? reasons.join('；') : (data.scenes[sid]?.summary || '');
    return { from: previous.join('、'), to: current.join('、'), reason };
  }

  function relationChain(pair) {
    const factsById = new Map(pair.facts.map((fact) => [fact.id, fact]));
    const seq = [];
    let prev = null;
    for (const sid of data.order) {
      const kinds = [...new Set((pair.perScene[sid] || []).map((fid) => factsById.get(fid)).filter(Boolean).map((fact) => fact.kind))];
      if (!kinds.length) continue; // 未声明关系的场次不参与
      const joined = kinds.join('、');
      if (joined !== prev) { seq.push(joined); prev = joined; }
    }
    return seq.join(' → ');
  }

  function relationEvents(pair) {
    if (!pair) return '';
    return pair.changePoints.map((sid) => {
      const { from, to, reason } = changeOf(pair, sid);
      const label = from ? `${from} → ${to}` : to;
      return `<button type="button" class="evo-event" data-jump-scene="${esc(sid)}" data-pair="${esc(pair.key)}"><b>${esc(sceneLabel(sid))}</b><span class="evo-transition">${esc(label)}</span>${reason ? `<span class="evo-reason">原因：${esc(reason)}</span>` : ''}</button><div class="evo-preview" hidden></div>`;
    }).join('');
  }

  function scenePreviewHtml(sid) {

  function highlightSceneInCharmap(sid) {

  function bindDetailActions() {

  function refRow(id, state) {
    return `<div class="ref-row"><button class="jump" data-jump-entity="${esc(id)}">${esc(nameOf(id))}</button>${state ? `<span class="ref-state">：${esc(state)}</span>` : ''}</div>`;
  }

  function renderSceneDetail(id) {
    const scene = data.scenes[id], index = data.order.indexOf(id);
    const location = scene.locationId ? entity(scene.locationId) : null;
    const area = location && scene.areaId ? (location.areas || []).find((item) => item.id === scene.areaId) : null;
    const locRow = location ? refRow(scene.locationId, area ? area.name : '') : '<div class="row">未指定</div>';
    const people = Object.entries(scene.participants || {}).map(([personId, value]) => {
      const detail = [value.emotion, value.goal, value.knowledge, value.appearance].filter(Boolean).join('；');

    }).join('') || '<div class="row">未指定</div>';
    const props = Object.entries(scene.props || {}).map(([propId, value]) => {
      const holder = value && Object.hasOwn(value, 'holderId') ? (value.holderId == null ? '无人持有' : `由${nameOf(value.holderId)}持有`) : '';
      const detail = [value?.condition, value?.appearance, holder].filter(Boolean).join('；');

    }).join('') || '<div class="row">未指定</div>';
    const beats = (scene.beats || []).map((beat) => `<button class="beat-item" data-beat="${esc(beat.id)}"><b>${BEATS[beat.kind] || beat.kind}${beat.kind === 'dialogue' && beat.speakerId ? ` · ${esc(nameOf(beat.speakerId))}` : ''}</b>${esc(beat.text)}</button>`).join('') || '<div class="row">尚无节拍</div>';
    const logic = data.edges.filter((edge) => edge.sourceScene === id || edge.targetScene === id).map(edgeText).join('') || '<div class="row">尚无显式逻辑关系</div>';
    const relations = data.characterRelations.filter((relation) => relation.sceneIds.includes(id)).map(relationText).join('') || '<div class="row">本场没有人物关系记录</div>';
    const changesHere = data.relationsByPair.filter((pair) => pair.changePoints.includes(id));
    const changeHtml = changesHere.map((pair) => {
      const { from, to, reason } = changeOf(pair, id);

      return `<div class="evo-event"><b>${esc(nameOf(pair.a))} ⇄ ${esc(nameOf(pair.b))}</b><span class="evo-transition">${esc(label)}</span>${reason ? `<span class="evo-reason">原因：${esc(reason)}</span>` : ''}</div>`;
    }).join('') || '<div class="row">本场没有关系变化</div>';
    const t = data.sceneTime && data.sceneTime[id];
    const timeLabel = data.timeKnown.includes(id) ? `时间点 ${(data.layer[id] || 0) + 1}${t ? `（${t}）` : ''}` : (t ? `故事时间先后未定（${t}）` : '故事时间先后未定');
    document.getElementById('detail').innerHTML = `<div class="scene-nav"><button data-nav="-1" ${index <= 0 ? 'disabled' : ''}>${icon('chevron-left')}上一场</button><button data-nav="1" ${index < 0 || index >= data.order.length - 1 ? 'disabled' : ''}>下一场${icon('chevron-right')}</button></div>
      <h3>${esc(scene.title || id)}${window.__SERVED__ ? ` <button class="edit-btn" data-edit-scene-title="${esc(id)}">改名</button>` : ''}</h3><div class="sub">第 ${index + 1} 场 · ${timeLabel}${data.inverted.includes(id) ? ' · 非线性讲述' : ''}</div><p>${esc(scene.summary || '情节概述待补充')}</p>
      <h4>地点</h4>${locRow}
      <h4>氛围</h4><div class="row">${esc(scene.mood || '未指定')}</div>
      <h4>故事线</h4><div class="row">${(scene.threadIds || []).map((threadId) => `<span class="tag">${esc(data.threads[threadId]?.name || threadId)}</span>`).join('') || '未指定'}</div>
      <h4>人物</h4>${people}<h4>道具</h4>${props}
      <details open><summary>场景节拍 · ${(scene.beats || []).length}</summary>${beats}</details>
      <details><summary>故事逻辑</summary>${logic}</details>
      <details><summary>本场人物关系</summary>${relations}</details>
      <details ${changesHere.length ? 'open' : ''}><summary>本场关系变化 · ${changesHere.length}</summary>${changeHtml}</details>`;
    bindDetailActions();
  }
  function renderBeatDetail(id) {
    const beat = beatOf(id); if (!beat) return;
    const logic = data.edges.filter((edge) => edge.source.id === id || edge.target.id === id).map(edgeText).join('') || '<div class="row">尚无显式逻辑关系</div>';
    document.getElementById('detail').innerHTML = `<button class="jump" data-jump-scene="${esc(beat.sceneId)}">${icon('chevron-left')} 返回 ${esc(sceneLabel(beat.sceneId))}</button>
      <h3>${esc(BEATS[beat.kind] || beat.kind)}</h3><div class="sub">场景节拍</div>
      ${beat.kind === 'dialogue' ? `<div class="row"><b>说话人</b>　<button class="jump" data-jump-entity="${esc(beat.speakerId)}">${esc(nameOf(beat.speakerId))}</button>${beat.tone ? ` · ${esc(beat.tone)}` : ''}</div>` : ''}
      <p>${esc(beat.text)}</p><h4>相关逻辑</h4>${logic}`;

  }
  function renderEntityDetail(id) {
    const item = entity(id), appearances = data.entityScenes[id] || [];
    const traits = Object.entries(item.fixedTraits || {}).map(([key, value]) => `<div class="row"><b>${esc(TRAIT_LABELS[key] || key)}</b>　${esc(value)}</div>`).join('');

    document.getElementById('detail').innerHTML = `<h3>${item.referenceImage ? `<img class="ref-thumb" src="${esc(item.referenceImage)}" alt="">` : ''}${esc(item.name || id)}${window.__SERVED__ ? ` <button class="edit-btn" data-edit-entity-name="${esc(id)}">改名</button>` : ''}</h3>
      <div class="sub">${TYPES[item.kind] || item.kind} · ${appearances.length} 场出现</div>${item.description ? `<p>${esc(item.description)}</p>` : ''}
      ${(item.tags || []).map((tag) => `<span class="tag">${esc(tag)}</span>`).join('')}${traits ? `<h4>固定设定</h4>${traits}` : ''}${item.motivation ? `<div class="row"><b>动机</b>　${esc(item.motivation)}</div>` : ''}
      ${pairs.length ? `<details open><summary>人物关系 · ${pairs.length}</summary>${pairs.map((pair) => {
        const other = pair.a === id ? pair.b : pair.a;
        const chain = relationChain(pair);
        const events = relationEvents(pair);
        const head = `与 <button class="jump" data-jump-entity="${esc(other)}">${esc(nameOf(other))}</button>${chain ? `<span class="pair-chain">${esc(chain)}</span>` : ''}`;
        return events ? `<details class="pair-block"><summary>${head}</summary>${events}</details>` : `<div class="pair-block static">${head}</div>`;
      }).join('')}</details>` : ''}
      <details open><summary>出现的场景 · ${appearances.length}</summary>${appearances.map((sceneId) => {
        const number = data.tellingIndex[sceneId] == null ? '—' : String(data.tellingIndex[sceneId] + 1).padStart(2, '0');
        return `<div class="scene-appearance"><button class="jump" data-jump-scene="${esc(sceneId)}"><span class="item-number">${number}</span><b>${esc(sceneTitle(sceneId))}</b></button><p>${esc(data.scenes[sceneId].summary || '')}</p></div>`;
      }).join('') || '<div class="row">尚未出场</div>'}</details>`;
    bindDetailActions();
  }
  function navigateScene(delta) {
    const currentId = state.selected?.type === 'scene' ? state.selected.id : beatOf(state.selected?.id)?.sceneId;
    const next = data.order[data.order.indexOf(currentId) + delta]; if (next) navigateTo(null, 'scene', next, true);
  }
  function setMode(mode) {
    const changed = state.mode !== mode;
    state.mode = mode;
    if (mode === 'telling' || mode === 'time') state.lastLogicMode = mode;
    svgs.forEach((svg) => svg.classList.toggle('active', svg.dataset.mode === mode));
    const logicView = mode !== 'charmap';
    document.querySelectorAll('[data-view]').forEach((tab) => {
      const active = (tab.dataset.view === 'logic') === logicView; tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', String(active)); tab.tabIndex = active ? 0 : -1;
    });

    layoutToggle.hidden = !logicView;

    document.getElementById('mode-context').textContent = HELP[mode];

    document.getElementById('story-count').textContent = `${data.stats.scenes} 场 · ${data.stats.entities} 个要素`;
    renderFilters(); applyFilters();
    if (state.selected) {
      const valid = mode === 'charmap' ? ['scene', 'entity'] : ['scene', 'beat'];
      valid.includes(state.selected.type) ? select(state.selected.type, state.selected.id) : clearSelection();
    }
    if (changed) readableView(); // 切换视图时按画布比例重新适配（选择/跳转不改缩放）
  }
  function setView(view) { const mode = view === 'charmap' ? 'charmap' : state.lastLogicMode || 'telling'; if (mode !== state.mode) pushHistory(); setMode(mode); }

  function bindCanvas() {
    for (const svg of svgs) {
      svg.addEventListener('wheel', (event) => {
        event.preventDefault();
        const rect = svg.getBoundingClientRect();
        const current = view.get(svg);
        if (event.ctrlKey || event.metaKey) {
          // 缩放：Ctrl/⌘ + 滚轮（或触控板双指缩放）
          zoom(event.deltaY > 0 ? 1.12 : 1 / 1.12, { x: current.x + ((event.clientX - rect.left) / rect.width) * current.w, y: current.y + ((event.clientY - rect.top) / rect.height) * current.h });
        } else {
          // 平移：滚轮上下、Shift+滚轮或横向滚动左右
          const unitX = current.w / rect.width;
          const unitY = current.h / rect.height;
          current.x += (event.shiftKey ? event.deltaY : event.deltaX) * unitX;
          current.y += (event.shiftKey ? 0 : event.deltaY) * unitY;
          applyView(svg);
        }
      }, { passive: false });
      let drag = null;
      svg.addEventListener('pointerdown', (event) => {
        if (event.target.closest('[data-node-id],.logic-edge,.pair-edge')) return;
        drag = { x: event.clientX, y: event.clientY, view: { ...view.get(svg) } };
        svg.setPointerCapture(event.pointerId); svg.classList.add('panning');
      });
      svg.addEventListener('pointermove', (event) => {
        if (!drag) return; const rect = svg.getBoundingClientRect(), current = view.get(svg);
        current.x = drag.view.x - (event.clientX - drag.x) * (drag.view.w / rect.width);
        current.y = drag.view.y - (event.clientY - drag.y) * (drag.view.h / rect.height); applyView(svg);
      });
      const stop = () => { drag = null; svg.classList.remove('panning'); };
      svg.addEventListener('pointerup', stop); svg.addEventListener('pointercancel', stop);
      svg.addEventListener('click', (event) => {
        const node = event.target.closest('[data-node-id]'); if (node) return navigateTo(null, node.dataset.nodeType, node.dataset.nodeId);
        const logic = event.target.closest('.logic-edge'); if (logic) { pushHistory(); return renderLogicDetail(logic.dataset.edgeId); }
        const relation = event.target.closest('.pair-edge'); if (relation) { pushHistory(); return renderCharacterRelationDetail(relation.dataset.relationId); }
      });
      svg.addEventListener('keydown', (event) => {
        if (!['Enter', ' '].includes(event.key)) return; event.preventDefault();
        const node = event.target.closest('[data-node-id]'); if (node) navigateTo(null, node.dataset.nodeType, node.dataset.nodeId);
      });
      svg.addEventListener('mouseover', (event) => {
        const node = event.target.closest('[data-node-id]'); if (!node) return;
        const id = node.dataset.nodeId;
        svg.querySelectorAll('.logic-edge, .part-edge, .pair-edge').forEach((edge) => {
          if (edge.dataset.source === id || edge.dataset.target === id) edge.classList.add('hover-show');
        });
      });
      svg.addEventListener('mouseout', (event) => {
        if (event.relatedTarget && event.relatedTarget.closest && event.relatedTarget.closest('[data-node-id]')) return;
        svg.querySelectorAll('.hover-show').forEach((edge) => edge.classList.remove('hover-show'));
      });
    }
  }
  function renderLogicDetail(id) {
    const edge = data.edges.find((item) => item.id === id); if (!edge) return;
    state.selected = { type: 'relation', id }; openDetail();
    document.getElementById('detail').innerHTML = `<h3>${RELS[edge.kind]}</h3><div class="sub">故事逻辑关系</div>${edgeText(edge)}`;
  }
  function renderCharacterRelationDetail(id) {
    const relation = data.characterRelations.find((item) => item.id === id); if (!relation) return;
    state.selected = { type: 'characterRelation', id }; openDetail();
    document.getElementById('detail').innerHTML = `<h3>${esc(relation.kind)}</h3><div class="sub">人物关系</div>${relationText(relation)}<h4>生效场景</h4>${relation.sceneIds.map((sceneId) => `<div class="row"><button class="jump" data-jump-scene="${esc(sceneId)}">${esc(sceneLabel(sceneId))}</button></div>`).join('')}`;
    bindDetailActions();
  }
  function renderMinimap() {
    const container = document.getElementById('minimap'), geom = data.geoms[state.mode], svg = activeSvg(); if (!geom || !svg) return;
    const scale = Math.min((MINI.w - MINI.pad * 2) / geom.w, (MINI.h - MINI.pad * 2) / geom.h);
    const ox = MINI.pad + (MINI.w - MINI.pad * 2 - geom.w * scale) / 2, oy = MINI.pad + (MINI.h - MINI.pad * 2 - geom.h * scale) / 2, current = view.get(svg);
    const nodes = geom.nodes.map((rect) => `<rect x="${ox + rect.x * scale}" y="${oy + rect.y * scale}" width="${Math.max(1, rect.w * scale)}" height="${Math.max(1, rect.h * scale)}" rx="1"/>`).join('');
    container.innerHTML = `<svg viewBox="0 0 ${MINI.w} ${MINI.h}" width="${MINI.w}" height="${MINI.h}">${nodes}<rect class="vp" x="${ox + current.x * scale}" y="${oy + current.y * scale}" width="${current.w * scale}" height="${current.h * scale}"/></svg>`;
  }

  function searchItems(query) {
    const q = query.toLocaleLowerCase(), results = [];
    for (const [id, scene] of Object.entries(data.scenes)) if (`${scene.title || ''} ${scene.summary || ''} ${id}`.toLocaleLowerCase().includes(q)) results.push({ type: 'scene', id, label: sceneLabel(id), detail: scene.summary || '场景' });
    for (const beat of data.beats) if (`${beat.text} ${beat.id}`.toLocaleLowerCase().includes(q)) results.push({ type: 'beat', id: beat.id, label: beat.text, detail: `节拍 · ${sceneLabel(beat.sceneId)}` });
    for (const [id, item] of Object.entries(data.entities)) if (`${item.name || ''} ${item.description || ''} ${(item.tags || []).join(' ')} ${id}`.toLocaleLowerCase().includes(q)) results.push({ type: 'entity', id, label: item.name || id, detail: TYPES[item.kind] || item.kind });
    return results.slice(0, 12);
  }
  function renderSearch(query) {
    const panel = document.getElementById('search-results'), input = document.getElementById('search');
    if (!query.trim()) { panel.hidden = true; input.setAttribute('aria-expanded', 'false'); return; }
    const results = searchItems(query.trim());
    panel.innerHTML = results.length ? results.map((result, index) => `<button class="search-result${index === 0 ? ' active' : ''}" data-result-type="${result.type}" data-result-id="${esc(result.id)}"><span class="result-type">${esc(result.detail)}</span><span class="result-text">${esc(result.label)}</span></button>`).join('') : '<div class="search-empty">没有匹配内容</div>';
    panel.hidden = false; input.setAttribute('aria-expanded', 'true');
    panel.querySelectorAll('.search-result').forEach((button) => button.addEventListener('click', () => chooseSearchResult(button)));
  }
  function chooseSearchResult(button) {
    const type = button.dataset.resultType; navigateTo(type === 'entity' ? 'charmap' : 'telling', type, button.dataset.resultId, true);
    document.getElementById('search-results').hidden = true; document.getElementById('search').setAttribute('aria-expanded', 'false');
  }
  function bindControls() {
    document.querySelectorAll('[data-view]').forEach((tab) => tab.addEventListener('click', () => setView(tab.dataset.view)));
    document.getElementById('layout-toggle').addEventListener('click', () => { pushHistory(); setMode(state.mode === 'time' ? 'telling' : 'time'); });
    document.getElementById('detail-back').addEventListener('click', goBack);
    document.getElementById('zoom-in').addEventListener('click', () => zoom(1 / 1.18));
    document.getElementById('zoom-out').addEventListener('click', () => zoom(1.18));
    document.getElementById('zoom-reset').addEventListener('click', readableView);
    document.getElementById('fit').addEventListener('click', fitAll);
    document.getElementById('focus').addEventListener('click', () => focusNode(state.selected?.type === 'beat' ? beatOf(state.selected.id)?.sceneId : state.selected?.id, true));
    document.getElementById('clear-selection').addEventListener('click', clearSelection);
    document.getElementById('close-detail').addEventListener('click', closeDetail);
    document.getElementById('toggle-right').addEventListener('click', () => body.classList.contains('right-open') ? closeDetail() : openDetail());
    document.getElementById('toggle-left').addEventListener('click', () => {
      body.classList.toggle('left-closed'); const open = !body.classList.contains('left-closed');
      document.getElementById('toggle-left').setAttribute('aria-expanded', String(open)); requestAnimationFrame(readableView);
    });
    document.getElementById('theme').addEventListener('click', () => {
      const root = document.documentElement; root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('sparkrealm-theme', root.dataset.theme); } catch (_) {}
    });
    document.getElementById('relation-scope').addEventListener('change', (event) => { state.relationScene = event.target.value; applyFilters(); });
    const search = document.getElementById('search');
    search.addEventListener('input', () => renderSearch(search.value));
    search.addEventListener('keydown', (event) => {
      const results = [...document.querySelectorAll('.search-result')];
      if (event.key === 'Enter' && results.length) { event.preventDefault(); chooseSearchResult(results.find((item) => item.classList.contains('active')) || results[0]); }
    });
    document.addEventListener('pointerdown', (event) => { if (!event.target.closest('.search-wrap')) document.getElementById('search-results').hidden = true; });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') { if (!document.getElementById('search-results').hidden) document.getElementById('search-results').hidden = true; else clearSelection(); }
      if (event.target.matches('input,select,button')) return;
      if (event.key === 'ArrowRight') navigateScene(1); if (event.key === 'ArrowLeft') navigateScene(-1);
    });
    document.getElementById('minimap').addEventListener('click', (event) => {
      const geom = data.geoms[state.mode], rect = event.currentTarget.getBoundingClientRect();
      const scale = Math.min((MINI.w - MINI.pad * 2) / geom.w, (MINI.h - MINI.pad * 2) / geom.h);
      const ox = MINI.pad + (MINI.w - MINI.pad * 2 - geom.w * scale) / 2, oy = MINI.pad + (MINI.h - MINI.pad * 2 - geom.h * scale) / 2, current = view.get(activeSvg());
      current.x = (event.clientX - rect.left - ox) / scale - current.w / 2; current.y = (event.clientY - rect.top - oy) / scale - current.h / 2; applyView(activeSvg());
    });
    window.addEventListener('resize', () => applyView(activeSvg()));
  }

  try { const theme = localStorage.getItem('sparkrealm-theme'); if (['dark', 'light'].includes(theme)) document.documentElement.dataset.theme = theme; } catch (_) {}
  renderOutline(); renderEntities(); renderRelationScope(); bindCanvas(); bindControls();
  document.getElementById('empty-state').hidden = data.stats.scenes !== 0;
  document.getElementById('detail').innerHTML = '<p>选择一个场景或故事要素，查看完整内容及其关联。</p>';
  if (window.matchMedia('(max-width: 700px)').matches) {
    body.classList.add('left-closed');
    document.getElementById('toggle-left').setAttribute('aria-expanded', 'false');
  }

  setMode('telling');
  restoreSession();

  // 服务模式：轮询 revision，外部（Agent 经 CLI）改动后自动刷新并保留视角
  if (window.__SERVED__) {
    const last = data.revision;
    setInterval(async () => {
      try {
        const response = await fetch('/state');
        const state = await response.json();
        if (state.revision !== last) { saveSession(); location.reload(); }
      } catch (_) { /* 忽略网络错误 */ }
    }, 2000);
  }

  window.__storygraph = {
    sendChange,
    getState: () => ({ mode: state.mode, revision: data.revision, selected: state.selected, served: Boolean(window.__SERVED__) }),
  };
})();
</script>
</body>
</html>
